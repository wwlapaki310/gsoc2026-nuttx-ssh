# =============================================================================
# docker-compose.yml — NuttX SSH 開発環境
#
# 使い方:
#   docker compose up nuttx      # NuttX を QEMU で起動
#   docker compose run dev bash  # 開発用インタラクティブシェル
# =============================================================================
services:

  # NuttX を QEMU で起動するサービス
  nuttx:
    build:
      context: .
      dockerfile: Dockerfile
    image: gsoc2026-nuttx-ssh:latest
    container_name: nuttx-qemu
    ports:
      - "2222:22"
    stdin_open: true
    tty: true
    # CMD は Dockerfile のデフォルトを使用 (/usr/local/bin/docker-entrypoint.sh)
    volumes:
      - .:/workspace
      - nuttx-build:/opt/nuttx

  # 開発用シェル (ビルド・編集・デバッグ)
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: gsoc2026-nuttx-ssh:latest
    container_name: nuttx-dev
    stdin_open: true
    tty: true
    command: ["/bin/bash"]
    volumes:
      - .:/workspace
      - nuttx-build:/opt/nuttx
    environment:
      - NUTTX_DIR=/opt/nuttx
      - APPS_DIR=/opt/apps
      - DROPBEAR_DIR=/opt/dropbear

volumes:
  nuttx-build:
